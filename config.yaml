# ============================================================================
# YoutubePlaylistCreator — daily curation config
# Search-only discovery (no subscriptions). Favours gaining-traction depth
# content and penalises clickbait. Tune freely — read at runtime, no code edits.
# ============================================================================

playlist:
  title: "🎯 Daily Mix"          # the rolling playlist is matched/created by this title
  description: >-
    Auto-curated daily by YoutubePlaylistCreator — gaining-traction deep dives:
    analysis & explainers, long-form interviews, mini-documentaries, video
    essays, and tactical sports breakdowns. No clickbait, no subscription feed.
  privacy: "private"             # private | unlisted | public
  mode: "rolling"                # rolling = accretive playlist (age-out + top-up) | dated = new per day
  age_out_days: 4                # remove entries that have been in the playlist longer than this
  max_size: 100                  # safety cap on total playlist length

discovery:
  region_code: "US"
  relevance_language: "en"
  lookback_hours: 48             # only consider videos published within this window
  search_results_per_query: 15   # results requested per topic search

scoring:
  # Relative influence of each signal. `clickbait` is a PENALTY (subtracted).
  weights:
    velocity: 2.0                # views-per-hour — the headline "gaining traction" signal
    engagement: 1.4             # like-to-view ratio — resonance / quality
    recency: 1.6                # freshness within the lookback window
    views: 0.6                  # raw reach (deliberately minor vs. velocity)
    keyword_match: 1.0          # category keyword overlap
    clickbait: 2.5              # how hard to punish provocative / baity titles
  exclude_shorts: true
  min_duration_seconds: 180      # global floor — skip quick hits, favour substance
  max_duration_seconds: 9000     # global ceiling (2.5h)

# Each category runs its own topic searches; the top `target` (by score) are kept.
categories:
  - name: "Current Affairs & Analysis"
    target: 4
    youtube_category_id: "25"    # News & Politics
    queries:
      - "news analysis explained"
      - "geopolitics explained deep dive"
      - "what is happening explained analysis"
    keywords: ["analysis", "explained", "breakdown", "deep dive", "context", "why", "what happened"]
    min_duration_seconds: 360

  - name: "Sports Storylines & Tactics"
    target: 3
    youtube_category_id: "17"    # Sports
    queries:
      - "tactical analysis breakdown"
      - "player story explained"
      - "scouting report film breakdown"
    keywords: ["tactical", "analysis", "breakdown", "story", "explained", "scouting", "how", "the rise of"]
    min_duration_seconds: 360
    max_duration_seconds: 3600

  - name: "Long-form Interviews"
    target: 3
    queries:
      - "long form interview"
      - "in depth interview conversation"
    keywords: ["interview", "conversation", "in conversation", "sits down", "long form"]
    min_duration_seconds: 900

  - name: "Mini Documentaries"
    target: 3
    queries:
      - "mini documentary"
      - "short documentary the story of"
    keywords: ["documentary", "the story of", "inside", "how", "the rise and fall"]
    min_duration_seconds: 600
    max_duration_seconds: 4500

  - name: "Video Essays & Explainers"
    target: 3
    queries:
      - "video essay"
      - "explainer how it works"
      - "the economics of explained"
    keywords: ["essay", "explainer", "how", "why", "explained", "deep dive", "the economics of"]
    min_duration_seconds: 480
    max_duration_seconds: 4500

# ============================================================================
# YoutubePlaylistCreator — daily curation config
#
# Backbone: a curated allowlist of high-information channels per category (NOT
# your subscriptions) + strictly-filtered open search. Topics lead; sports
# highlights are capped and interspersed (see the spread-interleave in scoring).
# ============================================================================

playlist:
  title: "🎯 Daily Mix"
  description: >-
    Auto-curated daily — a diverse mix of high-information depth: world affairs &
    political analysis, economics, science & tech, history, documentaries, expert
    interviews/podcasts and sports analysis, with the day's marquee sports
    highlights interspersed. Curated sources, no clickbait, no subscription feed.
  privacy: "private"
  mode: "rolling"                # accretive: age-out + top-up (never wiped)
  age_out_days: 4
  max_size: 180

discovery:
  region_code: "US"
  relevance_language: "en"
  lookback_hours: 48
  search_results_per_query: 12
  uploads_per_channel: 5         # default; sports highlights overrides this

scoring:
  weights:
    trusted: 2.5                 # from a curated allowlist channel — the quality anchor
    velocity: 1.6                # views-per-hour ("gaining traction")
    engagement: 1.2              # like-to-view ratio
    recency: 1.4                 # freshness within the window
    views: 0.6                   # raw reach (minor)
    keyword_match: 1.0
    clickbait: 2.5               # penalty weight for baity titles
  exclude_shorts: true
  min_duration_seconds: 240
  max_duration_seconds: 10800    # 3h
  clickbait_cutoff: 0.35
  min_search_views: 3000         # open-search videos below this are dropped (low-traction)
  exclude_keywords: []

# Targets are deliberately topic-heavy: ~22 non-sports vs ~11 sports per day, so
# the playlist is a diverse mix with highlights sprinkled through it.
categories:
  - name: "World Affairs & Political Analysis"
    target: 4
    youtube_category_id: "25"    # News & Politics
    channels:
      - "@VoxDotCom"
      - "@johnnyharris"
      - "@PolyMatter"
      - "@WendoverProductions"
      - "@RealLifeLore"
      - "@TLDRnewsGlobal"
      - "@CaspianReport"
      - "@VisualPolitikEN"
    queries:
      - "geopolitics analysis explained"
      - "foreign policy analysis"
    keywords: ["geopolitics", "politics", "analysis", "explained", "foreign policy", "election", "conflict", "policy"]
    min_duration_seconds: 360

  - name: "Economics, Finance & Markets"
    target: 3
    youtube_category_id: "25"
    channels:
      - "@PBoyle"
      - "@MoneyMacro"
      - "@ThePlainBagel"
      - "@Asianometry"
      - "@CNBCi"
      - "@FinancialTimes"
      - "@EconomicsExplained"
    queries:
      - "economics explained analysis"
      - "markets analysis deep dive"
    keywords: ["economics", "economy", "markets", "finance", "inflation", "analysis", "explained"]
    min_duration_seconds: 360

  - name: "Science & Technology"
    target: 4
    youtube_category_id: "28"    # Science & Technology
    channels:
      - "@veritasium"
      - "@kurzgesagt"
      - "@QuantaScienceChannel"
      - "@RealEngineering"
      - "@pbsspacetime"
      - "@Asianometry"
    queries:
      - "science explained"
      - "engineering deep dive"
    keywords: ["science", "physics", "engineering", "technology", "research", "how", "why", "explained"]
    min_duration_seconds: 300

  - name: "History"
    target: 3
    channels:
      - "@KingsandGenerals"
      - "@FallofCivilizationsPodcast"
      - "@HistoriaCivilis"
      - "@TheGreatWar"
    queries:
      - "history documentary"
      - "ancient history explained"
    keywords: ["history", "ancient", "empire", "war", "the story of", "civilization", "historical"]
    min_duration_seconds: 480

  - name: "Documentaries"
    target: 4
    channels:
      - "@DWDocumentary"
      - "@frontline"
      - "@MagnatesMedia"
      - "@ColdFusion"
    queries:
      - "mini documentary"
      - "investigative documentary"
    keywords: ["documentary", "investigation", "the story of", "inside", "the rise and fall"]
    min_duration_seconds: 600

  - name: "Expert Interviews & Podcasts"
    target: 4
    channels:
      - "@lexfridman"
      - "@DwarkeshPatel"
      - "@TheDiaryOfACEO"
      - "@a16z"
      - "@ycombinator"
      - "@bigthink"
      - "@TED"
    queries:
      - "long form interview researcher"
      - "in depth interview expert"
    keywords: ["interview", "conversation", "in conversation", "podcast", "sits down", "fireside"]
    min_duration_seconds: 1200

  - name: "Sports Analysis & Storylines"
    target: 3
    youtube_category_id: "17"    # Sports
    channels:
      - "@tifofootball"
      - "@SecretBase"
      - "@JxmyHighroller"
      - "@ThinkingBasketball"
      - "@ZonalMarking"
    queries:
      - "tactical analysis breakdown football"
      - "nba film breakdown analysis"
    keywords: ["tactical", "analysis", "breakdown", "story", "explained", "scouting", "the rise of"]
    min_duration_seconds: 360
    max_duration_seconds: 3600

  - name: "Sports Highlights"            # the day's marquee games — interspersed, not dominating
    target: 8
    youtube_category_id: "17"
    skip_quality_filters: true
    highlights_only: true                # only real game highlights
    dedupe_matchups: true                # one entry per game (no league + team-channel dupes)
    uploads_per_channel: 12
    channels:
      - "@NFL"
      - "@NBA"
      - "@NHL"
      - "@MLB"
      - "@FIFA"
      - "@UEFA"
      - "@Ligue1"
      - "@Concacaf"
      - "@premierleague"
      - "@cbssportsgolazo"
      - "@LaLiga"
      - "@Bundesliga"
      - "@SerieA"
      - "@MLSSoccer"
    queries:
      - "Champions League highlights"
      - "World Cup highlights"
      - "Premier League highlights"
      - "NHL highlights"
      - "NBA highlights"
      - "NFL highlights"
      - "Ligue 1 highlights"
      - "CONCACAF Gold Cup highlights"
    keywords: ["highlights", "recap", "full time", "game", "match", "extended", "full game"]
    min_duration_seconds: 120
    max_duration_seconds: 1800

# ============================================================================
# YoutubePlaylistCreator — daily curation config
# Tune freely. Everything here is read at runtime; no code changes needed.
# ============================================================================

playlist:
  title: "🎯 Daily Mix"          # rolling playlist is matched/created by this title
  description: >-
    Auto-curated daily by YoutubePlaylistCreator — sports highlights, high-value
    news, interviews, mini-documentaries and video essays. Refreshed every morning.
  privacy: "private"             # private | unlisted | public
  mode: "rolling"                # rolling = clear & refill one playlist | dated = new playlist per day

discovery:
  region_code: "US"
  relevance_language: "en"
  lookback_hours: 36             # only consider videos published within this window
  use_subscriptions: true
  max_subscription_channels: 60  # cap channels scanned (controls API quota)
  uploads_per_channel: 6         # most-recent uploads pulled per subscribed channel
  search_results_per_query: 12   # results requested per topic search

scoring:
  # Relative weights for the ranking signals. Higher = more influential.
  weights:
    views: 1.0                   # log-scaled view count
    recency: 1.6                 # how recently it was published (within the lookback window)
    engagement: 1.2              # like-to-view ratio
    subscribed_boost: 2.0        # bonus when the video is from a channel you follow
    keyword_match: 1.0           # category keyword overlap in title/description
  exclude_shorts: true
  min_duration_seconds: 90       # global floor (also filters out Shorts)
  max_duration_seconds: 7200     # global ceiling (2h)

# Each category builds its own candidate pool (subscription uploads that match it +
# its topic searches), then the top `target` videos are selected.
categories:
  - name: "Sports Highlights"
    target: 4
    youtube_category_id: "17"    # Sports
    queries:
      - "game highlights"
      - "match highlights recap"
    keywords: ["highlights", "recap", "full time", "extended", "match", "game"]
    min_duration_seconds: 120
    max_duration_seconds: 1800

  - name: "High-Value News"
    target: 4
    youtube_category_id: "25"    # News & Politics
    queries:
      - "news analysis explained"
      - "top stories today"
    keywords: ["news", "analysis", "explained", "report", "briefing"]
    min_duration_seconds: 180
    max_duration_seconds: 2400

  - name: "Interviews"
    target: 3
    queries:
      - "long form interview"
      - "in depth interview"
    keywords: ["interview", "conversation", "in conversation", "sits down", "talks"]
    min_duration_seconds: 600

  - name: "Mini Documentaries"
    target: 3
    queries:
      - "mini documentary"
      - "short documentary"
    keywords: ["documentary", "doc", "the story of", "how", "inside"]
    min_duration_seconds: 480
    max_duration_seconds: 3600

  - name: "Video Essays"
    target: 3
    queries:
      - "video essay"
      - "deep dive essay"
    keywords: ["essay", "video essay", "deep dive", "why", "the problem with", "explained"]
    min_duration_seconds: 480
    max_duration_seconds: 3600

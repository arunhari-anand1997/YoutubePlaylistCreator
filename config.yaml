# ============================================================================
# YoutubePlaylistCreator — daily curation config
#
# Backbone: a curated allowlist of high-information channels per category
# (NOT your subscriptions) + strictly-filtered open search. Allowlist uploads
# are trusted and routed to their category; open-search results must clear a
# clickbait cutoff and a low-info blocklist. Edit `channels:` freely — handles
# that don't resolve are skipped with a warning.
# ============================================================================

playlist:
  title: "🎯 Daily Mix"
  description: >-
    Auto-curated daily — high-information depth content: world affairs, economics,
    science/tech, expert interviews & podcasts, plus daily sports highlights and
    tactical analysis. Curated trusted sources, no clickbait, no subscription feed.
  privacy: "private"
  mode: "rolling"                # accretive: age-out + top-up (never wiped)
  age_out_days: 4
  max_size: 250

discovery:
  region_code: "US"
  relevance_language: "en"
  lookback_hours: 48
  search_results_per_query: 12
  uploads_per_channel: 5         # recent uploads pulled per allowlist channel

scoring:
  weights:
    trusted: 2.5                 # from a curated allowlist channel — the quality anchor
    velocity: 1.6                # views-per-hour ("gaining traction")
    engagement: 1.2              # like-to-view ratio
    recency: 1.4                 # freshness within the window
    views: 0.6                   # raw reach (minor)
    keyword_match: 1.0
    clickbait: 2.5               # penalty weight for baity titles
  exclude_shorts: true
  min_duration_seconds: 240      # favour substance over quick hits
  max_duration_seconds: 10800    # 3h
  clickbait_cutoff: 0.35         # open-search videos at/above this are dropped
  min_search_views: 3000         # open-search videos below this view count are dropped (low-traction)
  exclude_keywords: []           # extra low-info terms to block (besides the built-ins)

categories:
  - name: "World Affairs & Geopolitics"
    target: 4
    youtube_category_id: "25"    # News & Politics
    channels:
      - "@VoxDotCom"
      - "@johnnyharris"
      - "@PolyMatter"
      - "@WendoverProductions"
      - "@RealLifeLore"
      - "@TLDRnewsGlobal"
      - "@CaspianReport"
      - "@DWDocumentary"
    queries:
      - "geopolitics analysis explained"
      - "foreign policy explained"
    keywords: ["geopolitics", "analysis", "explained", "foreign policy", "why", "the rise of", "conflict"]
    min_duration_seconds: 360

  - name: "Economics, Finance & Markets"
    target: 3
    youtube_category_id: "25"
    channels:
      - "@PBoyle"               # Patrick Boyle
      - "@MoneyMacro"
      - "@ThePlainBagel"
      - "@Asianometry"
      - "@CNBCi"                # CNBC International
      - "@FinancialTimes"
      - "@EconomicsExplained"
    queries:
      - "economics explained analysis"
      - "markets analysis deep dive"
    keywords: ["economics", "economy", "markets", "finance", "analysis", "explained", "why", "inflation"]
    min_duration_seconds: 360

  - name: "Science, Tech & History"
    target: 3
    youtube_category_id: "28"    # Science & Technology
    channels:
      - "@veritasium"
      - "@kurzgesagt"
      - "@QuantaScienceChannel"
      - "@RealEngineering"
      - "@pbsspacetime"
      - "@Asianometry"
      - "@KingsandGenerals"
      - "@FallofCivilizationsPodcast"
    queries:
      - "science explained documentary"
      - "history documentary"
    keywords: ["science", "engineering", "technology", "history", "documentary", "how", "why", "explained"]
    min_duration_seconds: 360

  - name: "Expert Interviews & Podcasts"
    target: 3
    channels:
      - "@lexfridman"
      - "@DwarkeshPatel"
      - "@TheDiaryOfACEO"
      - "@a16z"
      - "@ycombinator"
      - "@bigthink"
      - "@TED"
    queries:
      - "long form interview researcher"
      - "in depth interview expert"
    keywords: ["interview", "conversation", "in conversation", "podcast", "sits down", "fireside"]
    min_duration_seconds: 1200

  - name: "Sports Highlights"        # prior-day games across the major leagues
    target: 30                       # comprehensive coverage, not a top-5
    youtube_category_id: "17"    # Sports
    skip_quality_filters: true       # don't drop "GAME HIGHLIGHTS!!" / low-view fresh uploads
    highlights_only: true            # accept ONLY game highlights, not pressers/training/features
    uploads_per_channel: 18          # NBA/MLB post many game recaps per day
    channels:
      - "@NFL"
      - "@NBA"
      - "@NHL"
      - "@MLB"
      - "@FIFA"                  # World Cup / FIFA tournaments
      - "@UEFA"                  # Champions League, Euros
      - "@Ligue1"
      - "@Concacaf"              # Gold Cup, Nations League
      - "@premierleague"
      - "@cbssportsgolazo"       # US broadcaster: UCL / World Cup / CONCACAF
      - "@LaLiga"
      - "@Bundesliga"
      - "@SerieA"
      - "@MLSSoccer"
    queries:
      - "Champions League highlights"
      - "World Cup highlights"
      - "Premier League highlights"
      - "NHL highlights"
      - "NBA highlights"
      - "NFL highlights"
      - "Ligue 1 highlights"
      - "CONCACAF Gold Cup highlights"
      - "Euro highlights"
      - "La Liga highlights"
      - "full game highlights"
    keywords: ["highlights", "recap", "full time", "game", "match", "extended", "full game"]
    min_duration_seconds: 120        # some highlight packages are short
    max_duration_seconds: 1800

  - name: "Sports Analysis & Storylines"
    target: 3
    youtube_category_id: "17"
    channels:
      - "@tifofootball"
      - "@SecretBase"
      - "@JxmyHighroller"
      - "@ThinkingBasketball"
      - "@ZonalMarking"
    queries:
      - "tactical analysis breakdown football"
      - "nba film breakdown analysis"
    keywords: ["tactical", "analysis", "breakdown", "story", "explained", "scouting", "the rise of"]
    min_duration_seconds: 360
    max_duration_seconds: 3600
